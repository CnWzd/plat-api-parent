server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: plat-admin
  lifecycle:
    timeout-per-shutdown-phase: 15s

  # L2 分布式缓存（不可用时 TwoLevelCache 自动降级为仅 Caffeine，功能不受影响）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

# MyBatis-Flex 多数据源：master=管理库 / log=日志库（HikariCP 连接池）
mybatis-flex:
  datasource:
    master:
      type: com.zaxxer.hikari.HikariDataSource
      url: jdbc:mysql://127.0.0.1:3306/api_platform_mgr?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
    log:
      type: com.zaxxer.hikari.HikariDataSource
      url: jdbc:mysql://127.0.0.1:3306/api_platform_log?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

# 平台定制配置（生产环境通过环境变量覆盖敏感项）
plat:
  security:
    jwt:
      # HS256 密钥，长度须 >= 32 字节；生产环境必须用环境变量 PLAT_JWT_SECRET 覆盖
      secret: dev-only-jwt-secret-0123456789abcdef0123456789abcdef
      # 访问令牌有效期（文档要求 <= 15 分钟）
      access-ttl: 15m
      refresh-ttl: 7d
    # 网关 -> 管理服务内部调用的令牌
    internal-token: dev-internal-token-9f8e7d6c5b4a
  crypto:
    # AppSecret AES-GCM 加密密钥（32 字节）；生产环境用环境变量 PLAT_CRYPTO_KEY 覆盖
    secret-key: dev-only-aes-key-0123456789abcdef0123456789abcdef
  cache:
    # L1 Caffeine TTL（秒）
    l1-ttl-seconds: 30
    # L2 Redis TTL（秒）
    l2-ttl-seconds: 600
  seed:
    # 启动时幂等初始化演示数据（admin/demo 账号、演示 API、演示应用）
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    com.zdd.plat.admin: info
